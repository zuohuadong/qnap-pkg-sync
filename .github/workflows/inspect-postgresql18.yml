name: Inspect PostgreSQL 18 on CTFile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-postgresql18.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify purchased PostgreSQL records and public download metadata
        env:
          QNAP_DOWNLOAD_URL: ${{ secrets.QNAP_DOWNLOAD_URL }}
          QNAP_USERNAME: ${{ secrets.QNAP_USERNAME }}
          QNAP_PASSWORD: ${{ secrets.QNAP_PASSWORD }}
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
        run: |
          bun run - <<'BUN'
          import { fetchXml, xmlToJson } from './src/fetch-xml.ts';
          import { selectPostgresql18, packageFilename, remoteShareLink } from './scripts/postgresql18.mjs';
          import { getProductFolderName } from './src/ctfile-utils.ts';
          const env = process.env;
          const config = selectPostgresql18(await xmlToJson(await fetchXml({ url: env.QNAP_DOWNLOAD_URL, username: env.QNAP_USERNAME, password: env.QNAP_PASSWORD })));
          const keyOf = x => String(x.key || x.id || x.folder_id || x.file_id || '');
          const isFolder = x => x.icon === 'folder' || keyOf(x).startsWith('d');
          async function list(id, kind = 'folder') {
            const result = [];
            const seen = new Set();
            const number = String(id).replace(/^d/, '');
            for (let page = 1; page <= 100; page++) {
              const response = await fetch(`https://rest.ctfile.com/v1/public/${kind}/list`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session: env.CTFILE_SESSION, folder_id: number === '0' ? number : `d${number}`, page, page_size: 100 }),
                signal: AbortSignal.timeout(30000),
              });
              const data = await response.json();
              if (!response.ok || String(data.code) !== '200') throw new Error(`CTFile HTTP ${response.status}, code ${data.code}`);
              const rows = data.results ?? data.data;
              if (!Array.isArray(rows)) throw new Error('Unexpected CTFile response');
              for (const row of rows) {
                const key = keyOf(row);
                if (seen.has(key)) throw new Error('Repeated CTFile page');
                seen.add(key);
                result.push({ ...row, default_passcode: data.default_passcode });
              }
              if (rows.length < 100) return result;
            }
            throw new Error('Too many CTFile pages');
          }
          const inspected = new Set();
          async function inspect(file) {
            if (inspected.has(keyOf(file))) return;
            inspected.add(keyOf(file));
            const url = remoteShareLink(file);
            console.log('REMOTE_PACKAGE ' + JSON.stringify({ fileId: keyOf(file), filename: file.name || file.file_name, size: file.size || file.file_size, status: file.status, ctfileUrl: url }));
            if (!url) return;
            try {
              const share = new URL(url);
              const id = share.pathname.match(/^\/f\/(.+)$/)?.[1];
              if (!id) return;
              const api = new URL('https://webapi.ctfile.com/getfile.php');
              api.searchParams.set('path', 'f');
              api.searchParams.set('f', id);
              api.searchParams.set('passcode', share.searchParams.get('p') || '');
              const response = await fetch(api, { signal: AbortSignal.timeout(30000), headers: { Referer: url } });
              const data = await response.json();
              const metadata = data.file || data.data?.file || data.data || {};
              const name = metadata.file_name || metadata.name || data.file_name;
              console.log('PUBLIC_PACKAGE ' + JSON.stringify({ httpStatus: response.status, code: data.code, filename: name, fileId: metadata.file_id || metadata.id, size: metadata.file_size || metadata.size, nameMatches: name === (file.name || file.file_name), fields: Object.keys(data) }));
            } catch { console.log('PUBLIC_PACKAGE_CHECK_UNAVAILABLE ' + (file.name || file.file_name)); }
          }
          const root = await list(env.CTFILE_FOLDER_ID);
          for (const app of config.plugins.item) {
            const expected = [...new Set(app.platform.map(p => packageFilename(p.location)))];
            console.log('EXPECTED_PACKAGES ' + JSON.stringify({ name: app.name, version: app.version, filenames: expected }));
            const folder = root.find(x => isFolder(x) && (x.name || x.folder_name) === getProductFolderName(app.name));
            if (!folder) { console.log('PRODUCT_FOLDER_NOT_CREATED'); continue; }
            const entries = await list(keyOf(folder));
            for (const location of [folder, ...entries.filter(isFolder)]) {
              const files = await list(keyOf(location), 'file');
              for (const file of files.filter(x => !isFolder(x) && expected.includes(x.name || x.file_name))) await inspect(file);
            }
          }
          console.log('VERIFIED_REMOTE_PACKAGE_COUNT ' + inspected.size);
          BUN
