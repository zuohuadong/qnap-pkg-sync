name: Inspect PostgreSQL 18 on CTFile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-postgresql18.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Read PostgreSQL package records and canonical links
        env:
          QNAP_DOWNLOAD_URL: ${{ secrets.QNAP_DOWNLOAD_URL }}
          QNAP_USERNAME: ${{ secrets.QNAP_USERNAME }}
          QNAP_PASSWORD: ${{ secrets.QNAP_PASSWORD }}
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
        run: |
          bun run - <<'BUN'
          import { fetchXml, xmlToJson } from './src/fetch-xml.ts';
          import { selectPostgresql18, packageFilename, remoteShareLink } from './scripts/postgresql18.mjs';
          import { getProductFolderName } from './src/ctfile-utils.ts';
          const env = process.env;
          const config = selectPostgresql18(await xmlToJson(await fetchXml({ url: env.QNAP_DOWNLOAD_URL, username: env.QNAP_USERNAME, password: env.QNAP_PASSWORD })));
          const keyOf = x => String(x.key || x.id || x.folder_id || x.file_id || '');
          const isFolder = x => x.icon === 'folder' || keyOf(x).startsWith('d');
          async function list(id, kind = 'folder', numeric = false) {
            const result = [];
            const seen = new Set();
            const number = String(id).replace(/^d/, '');
            for (let page = 1; page <= 100; page++) {
              const response = await fetch(`https://rest.ctfile.com/v1/public/${kind}/list`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session: env.CTFILE_SESSION, folder_id: number === '0' || numeric ? number : `d${number}`, page, page_size: 100 }),
                signal: AbortSignal.timeout(30000),
              });
              const data = await response.json();
              if (!response.ok || String(data.code) !== '200') throw new Error(`CTFile HTTP ${response.status}, code ${data.code}`);
              const rows = data.results ?? data.data;
              if (!Array.isArray(rows)) throw new Error('Unexpected CTFile response');
              for (const row of rows) {
                const key = keyOf(row);
                if (seen.has(key)) throw new Error('Repeated CTFile page');
                seen.add(key);
                result.push({ ...row, default_passcode: data.default_passcode });
              }
              if (rows.length < 100) return result;
            }
            throw new Error('Too many CTFile pages');
          }
          function safeRow(row) {
            const allowed = ['key', 'id', 'name', 'file_name', 'folder_name', 'icon', 'size', 'file_size', 'weblink', 'url', 'short_url', 'share_url'];
            return { ...Object.fromEntries(allowed.filter(key => row[key] !== undefined).map(key => [key, row[key]])), ctfileUrl: remoteShareLink(row) };
          }
          const root = await list(env.CTFILE_FOLDER_ID);
          for (const app of config.plugins.item) {
            const expected = [...new Set(app.platform.map(p => packageFilename(p.location)))];
            console.log('EXPECTED_PACKAGES ' + JSON.stringify({ name: app.name, version: app.version, filenames: expected }));
            const folder = root.find(x => isFolder(x) && (x.name || x.folder_name) === getProductFolderName(app.name));
            if (!folder) { console.log('PRODUCT_FOLDER_NOT_CREATED'); continue; }
            console.log('PRODUCT_FOLDER ' + JSON.stringify(safeRow(folder)));
            const entries = await list(keyOf(folder));
            for (const location of [folder, ...entries.filter(isFolder)]) {
              console.log('PACKAGE_FOLDER ' + JSON.stringify(safeRow(location)));
              for (const kind of ['folder', 'file']) for (const numeric of [false, true]) {
                try {
                  const files = await list(keyOf(location), kind, numeric);
                  const packages = files.filter(x => !isFolder(x) && expected.includes(x.name || x.file_name));
                  console.log('PACKAGE_COUNT ' + JSON.stringify({ kind, numeric, totalRows: files.length, packages: packages.length }));
                  for (const file of packages) {
                    console.log('PACKAGE_FIELDS ' + JSON.stringify(Object.keys(file)));
                    console.log('REMOTE_PACKAGE ' + JSON.stringify(safeRow(file)));
                  }
                } catch (error) { console.log(`LIST_ERROR ${kind} ${numeric}: ${error.message}`); }
              }
            }
          }
          BUN
      - name: Check availability of the existing WebDAV fallback
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          bun run - <<'BUN'
          const env = process.env;
          const configured = Boolean(env.WEBDAV_URL && env.WEBDAV_USERNAME && env.WEBDAV_PASSWORD);
          if (!configured) { console.log('WEBDAV_AVAILABILITY ' + JSON.stringify({ configured: false })); process.exit(0); }
          try {
            const url = new URL(env.WEBDAV_URL);
            if (url.protocol !== 'https:') throw new Error('HTTPS required');
            const response = await fetch(url, {
              method: 'PROPFIND', redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { Depth: '0', Authorization: 'Basic ' + Buffer.from(`${env.WEBDAV_USERNAME}:${env.WEBDAV_PASSWORD}`).toString('base64') },
            });
            await response.body?.cancel();
            console.log('WEBDAV_AVAILABILITY ' + JSON.stringify({ configured, httpStatus: response.status, isCtfile: url.hostname === 'ctfile.com' || url.hostname.endsWith('.ctfile.com') }));
          } catch { console.log('WEBDAV_AVAILABILITY ' + JSON.stringify({ configured, reachable: false })); }
          BUN
