name: Sync QNAP Packages

on:
  # Daily UTC 23:17 = Beijing 07:17 / Tokyo 08:17 the next day.
  # Changing the cron also reactivates schedules disabled for repository inactivity.
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      product:
        description: 'Exact product/internal name; empty means every purchased product'
        type: string
        default: ''
      dry_run:
        description: 'Inspect remote inventory and links without downloading or uploading'
        type: boolean
        default: false
  workflow_call:
    inputs:
      product:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
  push:
    branches: [main, feat/automatic-purchase-sync]
    paths:
      - scripts/purchase-sync-core.mjs
      - scripts/sync-purchases.mjs
      - tests/purchase-sync*.test.mjs
      - .github/workflows/sync-packages.yml
  pull_request:
    paths:
      - scripts/purchase-sync-core.mjs
      - scripts/sync-purchases.mjs
      - tests/purchase-sync*.test.mjs
      - .github/workflows/sync-packages.yml

permissions:
  contents: read
  actions: read

# Share the lock with manual PostgreSQL runs; never interrupt an in-flight upload.
concurrency:
  group: sync-packages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: New reconciliation and existing regression tests
        run: |
          node --test tests/purchase-sync*.test.mjs tests/postgresql18.test.mjs
          bun test tests/ctfile-upload.test.ts tests/concurrency.test.ts

  sync:
    needs: tests
    if: github.event_name != 'pull_request' && github.repository == 'zuohuadong/qnap-pkg-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Feature-branch runs are always read-only, even if a caller requests uploads.
      SYNC_DRY_RUN: ${{ (github.ref != 'refs/heads/main' || inputs.dry_run == true) && 'true' || 'false' }}
      SYNC_PRODUCT: ${{ inputs.product || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Read workflow activation state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync-packages.yml" --jq '{name, state}'
      - name: Restore verified receipts (optimization only, never the work queue)
        uses: actions/cache/restore@v6
        with:
          path: .sync-state/receipts.json
          key: purchase-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: purchase-receipts-v1-
      - name: Apply supported network tuning
        run: |
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
      - name: Reconcile complete purchases with CTFile
        env:
          QNAP_DOWNLOAD_URL: ${{ secrets.QNAP_DOWNLOAD_URL }}
          QNAP_USERNAME: ${{ secrets.QNAP_USERNAME }}
          QNAP_PASSWORD: ${{ secrets.QNAP_PASSWORD }}
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_ROOT_PATH: /qnaporg-github
        run: bun run sync
      - name: Save receipts even after partial failure
        if: always() && env.SYNC_DRY_RUN != 'true'
        uses: actions/cache/save@v6
        with:
          path: .sync-state/receipts.json
          key: purchase-receipts-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified links and pending failures only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchased-packages-ctfile-links
          path: |
            reports/purchases/report.json
            reports/purchases/links.md
          if-no-files-found: warn
          retention-days: 30

  notify:
    needs: [tests, sync]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.dry_run != true && (inputs.product == '' || inputs.product == null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Maintain one failure issue and close it after recovery
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ needs.sync.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const base = `https://api.github.com/repos/${env.GITHUB_REPOSITORY}`;
          const title = '[QNAP sync] 自动同步失败';
          const run = `https://github.com/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`;
          async function api(path, method = 'GET', data) {
            const response = await fetch(base + path, { method, signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(data ? { body: JSON.stringify(data) } : {}) });
            if (!response.ok) throw new Error(`Notification API HTTP ${response.status}`);
            return response.json();
          }
          let issue;
          for (let page = 1; page <= 10; page++) {
            const rows = await api(`/issues?state=open&per_page=100&page=${page}`);
            issue = rows.find(x => !x.pull_request && x.title === title && x.user?.login === 'github-actions[bot]');
            if (issue || rows.length < 100) break;
          }
          const success = env.SYNC_RESULT === 'success' && env.TEST_RESULT === 'success';
          if (success) {
            if (issue) await api(`/issues/${issue.number}`, 'PATCH', { state: 'closed', body: `完整同步已恢复：[运行记录](${run})。` });
          } else {
            const body = `自动同步未全部完成。测试：${env.TEST_RESULT}；同步：${env.SYNC_RESULT}。\n\n[查看运行记录与待重试清单](${run})。\n\n下次任务会重新核对完整购买源和 CTFile；已验证文件不会重复上传。凭据失效需要更新仓库 Secrets。`;
            await api(issue ? `/issues/${issue.number}` : '/issues', issue ? 'PATCH' : 'POST', { title, body });
          }
          NODE
