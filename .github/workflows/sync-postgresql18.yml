name: Sync PostgreSQL 18
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only; do not download or upload'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  issues: write
# PostgreSQL is included in the daily all-purchases task. Keep this manual entry
# for compatibility, delegating to the same implementation and concurrency lock.
jobs:
  sync:
    uses: ./.github/workflows/sync-packages.yml
    with:
      product: PostgreSQL 18
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
