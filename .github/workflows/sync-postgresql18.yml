name: Sync PostgreSQL 18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/postgresql18.mjs
      - src/ctfile.ts
      - src/ctfile-curl.ts
      - tests/postgresql18.test.mjs
      - tests/ctfile-upload.test.ts
      - .github/workflows/sync-postgresql18.yml
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

concurrency:
  group: sync-packages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    name: Verify and sync PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test package selection, links and upload failures
        run: |
          node --test tests/postgresql18.test.mjs
          bun test tests/ctfile-upload.test.ts
      - name: Apply existing upload network tuning
        run: |
          # Match the general synchronizer's BBR configuration where supported.
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.ipv4.tcp_notsent_lowat=16384 || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          curl --version | head -1
      - name: Synchronize purchased PostgreSQL 18 packages
        timeout-minutes: 75
        env:
          QNAP_DOWNLOAD_URL: ${{ secrets.QNAP_DOWNLOAD_URL }}
          QNAP_USERNAME: ${{ secrets.QNAP_USERNAME }}
          QNAP_PASSWORD: ${{ secrets.QNAP_PASSWORD }}
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
          CTFILE_UPLOAD_TRANSPORT: curl
          DOWNLOAD_CONCURRENCY: '2'
        run: |
          touch .env
          bun run scripts/postgresql18.mjs
      - name: Save verified CTFile links only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql18-ctfile-links
          path: reports/postgresql18/links.*
          if-no-files-found: warn
          retention-days: 7
