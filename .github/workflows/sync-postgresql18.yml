name: Sync PostgreSQL 18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/postgresql18.mjs
      - tests/postgresql18.test.mjs
      - .github/workflows/sync-postgresql18.yml
  # Daily verification and recovery, after the general package sync.
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

# Share the existing synchronizer's lock; never cancel an upload ourselves.
concurrency:
  group: sync-packages
  cancel-in-progress: false

jobs:
  sync:
    name: Verify and sync PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test package selection and link verification
        run: node --test tests/postgresql18.test.mjs
      - name: Synchronize purchased PostgreSQL 18 packages
        env:
          QNAP_DOWNLOAD_URL: ${{ secrets.QNAP_DOWNLOAD_URL }}
          QNAP_USERNAME: ${{ secrets.QNAP_USERNAME }}
          QNAP_PASSWORD: ${{ secrets.QNAP_PASSWORD }}
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
          DOWNLOAD_CONCURRENCY: '2'
        run: |
          # Legacy loadEnv requires a file. Keep it empty: credentials stay in env.
          touch .env
          bun run scripts/postgresql18.mjs
      - name: Save verified CTFile links only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql18-ctfile-links
          path: reports/postgresql18/links.*
          if-no-files-found: warn
          retention-days: 7
